name: Daily Dealer Gamma Collector

on:
  schedule:
    # 9:20 AM ET (13:20 UTC Mon-Fri during EDT / 14:20 UTC during EST) - Pre-market snapshot
    - cron: '20 13 * * 1-5'
    # 4:15 PM ET (20:15 UTC Mon-Fri during EDT / 21:15 UTC during EST) - Post-market verification
    - cron: '15 20 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub UI for testing

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚡ Run Gamma Daily Collector
        env:
          THETADATA_API_KEY: ${{ secrets.THETADATA_API_KEY }}
          DB_ENGINE: sqlite
        run: |
          python cron_collector.py

      - name: 🚀 Deploy API Files to Hostinger via FTP
        env:
          HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          HOSTINGER_FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          HOSTINGER_FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASS }}
        run: |
          python deploy_ftp.py
